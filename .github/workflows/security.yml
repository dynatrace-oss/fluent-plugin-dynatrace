name: Security check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check for security vulnerabilities
    # Snyk tracks main only; a manual run on another branch would overwrite main's snapshot.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          # Ruby bundled with fluent-package v6 LTS; bundle lock resolves for this version.
          ruby-version: '3.4'

      - name: Resolve dependencies
        # No Gemfile.lock is committed (gem convention). Resolve one from the gem's runtime
        # dependencies only, so Snyk scans what ships with the plugin, not dev/test tooling.
        # The gem source is taken over from the repo's own Gemfile.
        run: |
          mkdir snyk-runtime
          grep '^source ' Gemfile > snyk-runtime/Gemfile
          echo "gem 'fluent-plugin-dynatrace', path: '..'" >> snyk-runtime/Gemfile
          (cd snyk-runtime && bundle lock)

      - name: Run Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --file=snyk-runtime/Gemfile.lock --project-name=dynatrace-oss/fluent-plugin-dynatrace

      - name: Run Snyk on example Kubernetes manifests
        if: ${{ !cancelled() }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        # --report uploads the results to Snyk. Exit code 1 only means issues were found,
        # which is expected here: monitoring reports findings but does not fail on them.
        run: snyk iac test example --report --target-name=dynatrace-oss/fluent-plugin-dynatrace || [ "$?" -eq 1 ]

      - name: Run Snyk on example Dockerfile base image
        if: ${{ !cancelled() }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          base_image=$(awk 'toupper($1) == "FROM" { print $2; exit }' example/Dockerfile | tr -d '\r')
          snyk container monitor "${base_image}" --file=example/Dockerfile \
            --project-name=dynatrace-oss/fluent-plugin-dynatrace:example/Dockerfile

  test:
    name: Test for security vulnerabilities (no upload)
    # Manual runs on other branches only report locally via `snyk test`;
    # `snyk monitor` (build job) is reserved for main.
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          # Ruby bundled with fluent-package v6 LTS; bundle lock resolves for this version.
          ruby-version: '3.4'

      - name: Resolve dependencies
        # No Gemfile.lock is committed (gem convention). Resolve one from the gem's runtime
        # dependencies only, so Snyk scans what ships with the plugin, not dev/test tooling.
        # The gem source is taken over from the repo's own Gemfile.
        run: |
          mkdir snyk-runtime
          grep '^source ' Gemfile > snyk-runtime/Gemfile
          echo "gem 'fluent-plugin-dynatrace', path: '..'" >> snyk-runtime/Gemfile
          (cd snyk-runtime && bundle lock)

      - name: Run Snyk
        # Findings of all severities (low and above) are reported and fail the job.
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=low --file=snyk-runtime/Gemfile.lock

      - name: Run Snyk on example Kubernetes manifests
        if: ${{ !cancelled() }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk iac test example --severity-threshold=low

      - name: Run Snyk on example Dockerfile base image
        if: ${{ !cancelled() }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          base_image=$(awk 'toupper($1) == "FROM" { print $2; exit }' example/Dockerfile | tr -d '\r')
          snyk container test "${base_image}" --file=example/Dockerfile --severity-threshold=low
