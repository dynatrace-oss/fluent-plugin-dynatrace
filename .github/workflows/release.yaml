name: Publish to RubyGems

on:
  release:
    types: [published]

jobs:
  build:
    name: Build + Publish
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
    - name: Set up Ruby 2.7
      uses: actions/setup-ruby@e932e7af67fc4a8fc77bd86b744acd4e42fe3543 # v1
      with:
        ruby-version: 2.7.x

    - name: Publish to RubyGems
      run: |
        mkdir -p $HOME/.gem
        touch $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
        gem build fluent-plugin-dynatrace.gemspec
        gem push fluent-plugin-dynatrace-*.gem
      env:
        GEM_HOST_API_KEY: "${{secrets.RUBYGEMS_API_KEY_PUSH}}"
